[[actions]]
type = "create_table"
name = "api_rate_limit_buckets"
primary_key = ["key"]

  [[actions.columns]]
  name = "key"
  type = "TEXT"
  nullable = false

  [[actions.columns]]
  name = "count"
  type = "INTEGER"
  nullable = false
  default = "1"

  [[actions.columns]]
  name = "expires_at"
  type = "TIMESTAMPTZ"
  nullable = false

[[actions]]
type = "add_index"
table = "api_rate_limit_buckets"

  [actions.index]
  name = "api_rate_limit_buckets_expires_at_idx"
  columns = ["expires_at"]

