name: PR title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  validate:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|deps|revert)(\([a-z0-9._/-]+\))?!?: .+$'

          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::Use a Conventional Commit title, for example: feat(watchlist): add episode progress"
            exit 1
          fi
