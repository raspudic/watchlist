name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to recover and promote
        required: true
        type: string

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  checks: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  release:
    name: Release
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare or publish release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          release-type: node

      - name: Authorize production promotion
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            await github.rest.checks.create({
              ...context.repo,
              name: "Released",
              head_sha: process.env.RELEASE_SHA,
              status: "completed",
              conclusion: "success",
              output: {
                title: "GitHub release created",
                summary: "This exact commit is authorized for production promotion.",
              },
            });
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.RELEASE_SHA,
              state: "success",
              context: "Released",
              description: "GitHub release created and authorized for production.",
            });

      - name: Check out released commit
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Promote release to production
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          for attempt in 1 2 3 4 5; do
            if output=$(git push origin HEAD:refs/heads/release 2>&1); then
              printf '%s\n' "$output"
              exit 0
            else
              status=$?
            fi

            printf '%s\n' "$output"
            if [[ "$output" != *'Required status check "Released" is expected.'* ]] || (( attempt == 5 )); then
              exit "$status"
            fi
            sleep 5
          done

  recover:
    name: Recover published release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve published release
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG.trim();
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
              core.setFailed("Use a stable semantic-version tag such as v0.10.0.");
              return;
            }

            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag,
            });
            if (release.draft || release.prerelease) {
              core.setFailed(`${tag} is not a published stable release.`);
              return;
            }

            const { data: commit } = await github.rest.repos.getCommit({
              ...context.repo,
              ref: tag,
            });
            if (release.target_commitish !== commit.sha) {
              core.setFailed(`${tag} does not target its tagged commit exactly.`);
              return;
            }

            core.setOutput("sha", commit.sha);

      - name: Check out released commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Verify release belongs on main
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Authorize production promotion
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            await github.rest.checks.create({
              ...context.repo,
              name: "Released",
              head_sha: process.env.RELEASE_SHA,
              status: "completed",
              conclusion: "success",
              output: {
                title: "Published GitHub release recovered",
                summary: "This exact released commit is authorized for production promotion.",
              },
            });
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.RELEASE_SHA,
              state: "success",
              context: "Released",
              description: "Published GitHub release recovered for production.",
            });

      - name: Promote release to production
        run: |
          for attempt in 1 2 3 4 5; do
            if output=$(git push origin HEAD:refs/heads/release 2>&1); then
              printf '%s\n' "$output"
              exit 0
            else
              status=$?
            fi

            printf '%s\n' "$output"
            if [[ "$output" != *'Required status check "Released" is expected.'* ]] || (( attempt == 5 )); then
              exit "$status"
            fi
            sleep 5
          done
