name: Release

on:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Prepare or publish release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: node

      - name: Authorize production promotion
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            await github.rest.checks.create({
              ...context.repo,
              name: "Released",
              head_sha: process.env.RELEASE_SHA,
              status: "completed",
              conclusion: "success",
              output: {
                title: "GitHub release created",
                summary: "This exact commit is authorized for production promotion.",
              },
            });

      - name: Check out released commit
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Promote release to production
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: git push origin HEAD:refs/heads/release
